name: CI

on:
  pull_request:
    branches: [preprod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        # Same major version as docker-compose.yml: a migration that passes
        # here must be the one that passes on a contributor's machine.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chu
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: chu_grades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chu:ci@127.0.0.1:5432/chu_grades
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration
